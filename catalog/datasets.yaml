- id: nopims-ga
  name: NOPIMS (Geoscience Australia / NOPTA)
  category: national-archive
  region: All Australian offshore basins
  country: AU
  data_type: ["2D/3D/4D field (pre-stack)", "processed", "velocities", "navigation"]
  ancillary: ["well logs", "reports"]
  size_bytes: null
  size_display: "~3–4 PB"
  size_confidence: estimate
  size_bytes_min: 3000000000000000
  size_bytes_max: 4000000000000000
  license: "CC BY 4.0 after release"
  license_spdx: CC-BY-4.0
  usage:
    commercial: "yes"
    redistribution: "yes"
    attribution_required: "yes"
    share_alike: "no"
    ml_training: "yes"
  usage_basis: spdx
  access: open-download
  url: https://www.ga.gov.au/nopims
  download:
    - kind: portal
      uri: https://public.neats.nopta.gov.au/nopims
    - kind: odata
      uri: https://services.neats.nopta.gov.au/odata/v1/public/nopims/survey/PublicNopimsSurvey
  bulk_method: "portal basket download; public OData metadata APIs; very large orders offline via ausgeodata@ga.gov.au"
  notes: >-
    Almost certainly the largest genuinely-free archive that includes pre-stack
    field data. GA calls it "one of the world's largest collections of petroleum
    data". The public NEATS portal (public.neats.nopta.gov.au/nopims) browses
    without login and exposes public OData metadata APIs (Surveys, Wells,
    Reprocessings, Released Documents, Core Library) — no account needed. The
    Surveys OData returned 2,988 surveys, 428 of them 3D (3D MSS / MC3D /
    2D-3D MSS), verified 2026-09-12 via
    services.neats.nopta.gov.au/odata/v1/public/nopims/survey. Released data
    downloads WITHOUT an account: selecting an acquisition yields a session
    userToken and the Survey Data OData function GetSurveyDataForSelection
    (userToken=...) returns per-item Download_Url + File_Size_Bytes + Data_Format
    (SEGY) + Data_Description. Downloads use TWO hosts (verified 2026-09-12):
    files <=20 GB come from CloudFront (dnxxuwuw8tglo.cloudfront.net/Surveys/*.zip)
    which is behind AWS WAF bot mitigation — reliable in a browser but hostile to
    plain curl (intermittent HTTP 403/202 even with a full browser User-Agent), so
    scripting those needs a headless browser or the browser "copy as cURL"
    aws-waf-token cookie; files >20 GB come from a plain public S3 bucket
    (nopimsopenfile-20gb.s3.amazonaws.com/Surveys_20GB/*.zip) that IS cleanly
    scriptable/resumable with a UA (206 + Accept-Ranges confirmed). Example —
    Sequoia 3D MSS 2021 (ENO0603256, Otway, released) has 90 items incl. the
    post-stack 3D SEGY "Final Stacks" D00020664.zip (12,733,719,264 B, CloudFront)
    and "Raw Stacks" D00020663.zip; ZIPs unpack to SEG-Y. Data_Description labels
    the modality (Field seismic / Raw Stacks / Final Stacks / Gathers / Velocity /
    Navigation) so curation can filter to "Final Stacks" post-stack 3D. Unreleased
    seismic is request-only via the basket and, since 28 Nov 2025, needs
    ministerial approval before release.
  verified: true
  tags: ["prestack", "petabyte", "flagship"]

